name: build-installer
# WO-31/WO-33: release-candidate installer artifact (NOT a release).
# Runs only manually (workflow_dispatch). WO-33: artifact name
# "TakeOne-Studio-<version>-run<N>" + SHA256.txt, both built in CI.
# WO-40.4: the gate below is mandatory — this workflow builds ONLY from a
# commit whose verify workflow is ALL green (every job success/skipped).
# A red or still-running verify fails this workflow before any build.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # WO-40.4 gate: fail-closed. The installer name/version below come
      # from THIS commit (the checkout), so the gate checks THIS commit's
      # verify runs — never another commit's green run.
      - name: WO-40 gate — verify all green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = $env:GITHUB_SHA
          Write-Host "Gate: checking verify runs for commit $sha"
          gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$sha&per_page=20" > runs.json
          $runs = Get-Content runs.json -Raw | ConvertFrom-Json
          $latest = $runs.workflow_runs | Where-Object { $_.status -eq 'completed' } | Select-Object -First 1
          if (-not $latest) { Get-Content runs.json; throw "WO-40 gate: no completed verify run for commit $sha — run verify first and wait for green" }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($latest.id)/jobs?per_page=100" > jobs.json
          node tools/verify-green-gate.js runs.json jobs.json $sha
          if ($LASTEXITCODE -ne 0) { throw 'WO-40 gate FAILED: verify is not all-green for this commit — installer will not be built' }

      # WO-34: a version maps to exactly one commit — rebuilding the same
      # version from different code fails the build.
      - name: Version uniqueness check (WO-34)
        run: node tools/check-version-unique.js

      - name: Install deps
        run: npm ci

      - name: Read app version
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "APP_VERSION=$v"

      - name: Build installer (electron-builder NSIS)
        # Release candidate only: build the .exe, do NOT publish a GitHub release.
        run: node build/dist.js --publish never

      - name: SHA256 of the installer (WO-33)
        run: |
          $exe = Get-ChildItem dist/TakeOne-Studio-*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "installer .exe not found in dist/"; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -FilePath dist/SHA256.txt -Encoding ascii
          Get-Content dist/SHA256.txt

      - name: Upload installer artifact (WO-33)
        uses: actions/upload-artifact@v4
        with:
          name: TakeOne-Studio-${{ env.APP_VERSION }}-run${{ github.run_number }}
          path: |
            dist/TakeOne-Studio-*-setup.exe
            dist/SHA256.txt
          if-no-files-found: error
