name: shipped-python-spike
# WO-19: engine lock ko SHIPPED Python par sabit karo (CI, Windows).
# resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz extract,
# us ke python se -m venv, engine-lock.json ke wheelhouse se --no-index install,
# torch.version.cuda == '12.8' assert, ComfyUI boot exit 0.
# Agar venv/ensurepip missing hai to isay FAILED likha jata hai (raw log ke saath).
on:
  workflow_dispatch:

jobs:
  shipped-python:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Extract shipped Python
        run: |
          $tar = "resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz"
          if (-not (Test-Path $tar)) { Write-Error "SHIPPED PYTHON TARBALL MISSING: $tar"; exit 1 }
          New-Item -ItemType Directory -Force -Path .shipped-py | Out-Null
          tar -xzf $tar -C .shipped-py
          $py = Join-Path $PWD ".shipped-py/python.exe"
          if (-not (Test-Path $py)) {
            Write-Host "TREE:"; Get-ChildItem .shipped-py | Format-Table -AutoSize
            Write-Error "SHIPPED PYTHON LAYOUT: python.exe not found at $py"
            exit 1
          }
          & $py --version
          echo "SHIPPED_PY=$py" >> $env:GITHUB_ENV

      - name: Make venv with the SHIPPED python (WO-19 gate)
        run: |
          & $env:SHIPPED_PY -m venv .spike-venv 2>&1 | Tee-Object -FilePath venv-create.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "RAW venv-create.log:"; Get-Content venv-create.log
            Write-Error "FAILED: -m venv exited $LASTEXITCODE with the shipped python (ensurepip missing or other). Raw log above."
            exit 1
          }
          $vpy = Join-Path $PWD ".spike-venv/Scripts/python.exe"
          if (-not (Test-Path $vpy)) {
            Write-Host "RAW venv-create.log:"; Get-Content venv-create.log
            Write-Error "FAILED: venv dir created but Scripts/python.exe missing — venv/ensurepip incomplete. Raw log above."
            exit 1
          }
          echo "VENV_PY=$vpy" >> $env:GITHUB_ENV
          & $vpy --version

      - name: Rebuild wheelhouse from engine-lock.json (sha256-verified)
        run: |
          python - "$env:VENV_PY" <<'PYEOF'
          import json, os, urllib.request, hashlib, sys
          lock = json.load(open('engine-lock.json'))
          os.makedirs('wheelhouse', exist_ok=True)
          bad = 0
          for w in lock['wheels']:
              dest = os.path.join('wheelhouse', w['filename'])
              if os.path.exists(dest) and os.path.getsize(dest) == w['bytes']:
                  h = hashlib.sha256(open(dest,'rb').read()).hexdigest()
                  if h == w['sha256']:
                      print('have', w['filename']); continue
              print('fetch', w['filename'])
              urllib.request.urlretrieve(w['url'], dest)
              h = hashlib.sha256(open(dest,'rb').read()).hexdigest()
              if h != w['sha256'] or os.path.getsize(dest) != w['bytes']:
                  print('LOCK MISMATCH:', w['filename']); bad += 1
          print('wheels:', len(lock['wheels']), 'mismatches:', bad)
          sys.exit(1 if bad else 0)
          PYEOF

      - name: Install lock into shipped-python venv (--no-index)
        run: |
          & $env:VENV_PY -m pip install --no-index --find-links wheelhouse (Get-Content engine-lock.json | ConvertFrom-Json).wheels | ForEach-Object { $_.name + "==" + $_.version } | Select-Object -Unique
          & $env:VENV_PY -m pip check
          if ($LASTEXITCODE -ne 0) { Write-Error "pip check FAILED"; exit 1 }

      - name: Assert torch.version.cuda == '12.8'
        run: |
          & $env:VENV_PY -c "import torch; print('cuda:', torch.version.cuda); assert torch.version.cuda == '12.8', 'CUDA BUILD LOST'"

      - name: ComfyUI boot (exit 0)
        run: |
          $url = "https://github.com/comfyanonymous/ComfyUI/archive/b1a247c9cf9dbfda4b2c0a0c1d50950667eeaa0c.zip"
          Invoke-WebRequest -Uri $url -OutFile comfy.zip
          $h = (Get-FileHash comfy.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "14d2ffe3775d656ebe3d9a6f684b5f1874ac89992ca296ee3c4646c14ebe4e1e") { Write-Error "COMFY ZIP SHA MISMATCH: $h"; exit 1 }
          Expand-Archive comfy.zip -DestinationPath .
          $env:PYTHONPATH = "$PWD/ComfyUI-b1a247c9cf9dbfda4b2c0a0c1d50950667eeaa0c"
          & $env:VENV_PY "$PWD/ComfyUI-b1a247c9cf9dbfda4b2c0a0c1d50950667eeaa0c/main.py" --cpu --quick-test-for-ci 2>&1 | Tee-Object -FilePath comfy-boot.log
          if ($LASTEXITCODE -ne 0) { Write-Host "RAW comfy-boot.log tail:"; Get-Content comfy-boot.log -Tail 30; Write-Error "COMFY BOOT FAILED"; exit 1 }

      - name: Report
        if: always()
        run: |
          & $env:VENV_PY -c "import torch; print('torch', torch.__version__, '| cuda', torch.version.cuda)"
          $venvBytes = (Get-ChildItem .spike-venv -Recurse -File | Measure-Object Length -Sum).Sum
          "SHIPPED-PYTHON-SPIKE VENV BYTES: $venvBytes" | Out-File -Append $env:GITHUB_STEP_SUMMARY
