# TakeOne Studio — automated verification (no human QA).
# Status of this file: Implemented, NEVER RUN yet. Every job below is Not Tested until its first green run.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      measure_pip:
        description: 'Also measure pip install sizes on Windows + Python 3.11 (slow, several GB)'
        type: boolean
        default: false

jobs:
  logic-and-real-aria2-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Download manager logic tests (simulated aria2c)
        run: chmod +x tests/mock-aria2c.js && node --test tests/downloads.behavior.test.js
      - name: Download manager vs REAL aria2c (local server)
        run: |
          sudo apt-get update && sudo apt-get install -y aria2
          ARIA2C="$(which aria2c)" node --test tests/downloads.real-aria2.test.js

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Download manager vs the SHIPPED aria2c.exe (local server)
        shell: pwsh
        run: |
          if (-not (Test-Path resources/aria2c.exe)) { throw 'resources/aria2c.exe is missing in the repo checkout' }
          $env:ARIA2C = (Resolve-Path resources/aria2c.exe).Path
          node --test tests/downloads.real-aria2.test.js

      - name: Build installer
        id: build
        shell: pwsh
        env:
          TAKEONE_SKIP_WINE: '1'
        run: |
          foreach ($f in 'resources/aria2c.exe','resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz') {
            if (-not (Test-Path $f)) { throw "Missing $f — the installer cannot be built without it." }
          }
          node build/make-readme.js
          npx electron-builder --win nsis
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/TakeOne-Studio-$v-setup.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem dist; throw "Expected $exe. The installer name must carry the version ($v): unique-version rule." }
          "v=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "SHA256 $((Get-FileHash $exe -Algorithm SHA256).Hash)  $exe" | Tee-Object -FilePath dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TakeOne-Studio-${{ steps.build.outputs.v }}-run${{ github.run_number }}
          path: |
            dist/*-setup.exe
            dist/SHA256.txt

      - name: Silent install + first-launch smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $env:TAKEONE_SMOKE = '1'; $env:TAKEONE_SMOKE_LOG = $log
          Start-Process "${{ steps.build.outputs.exe }}" -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { Test-Path (Join-Path $_.FullName 'TakeOne Studio.exe') } | Select-Object -First 1
          if (-not $app) { throw 'Installer finished but TakeOne Studio.exe was not found under %LOCALAPPDATA%\Programs' }
          foreach ($rel in 'TakeOne Studio.exe','resources\aria2c.exe','resources\python.tar.gz') {
            if (-not (Test-Path (Join-Path $app.FullName $rel))) { throw "Installed app is missing $rel" }
          }
          if (-not (Get-Process -Name 'TakeOne Studio' -ErrorAction SilentlyContinue)) {
            Start-Process (Join-Path $app.FullName 'TakeOne Studio.exe')   # the one-click installer may or may not auto-launch
          }
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'wizard: page loaded')) { $ok = $true; break }
          }
          if (-not $ok) { throw 'The app did not reach the wizard within 180 s' }
          $py = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'TakeOne\.python\python.exe'
          if (-not (Test-Path $py)) { throw "Bundled Python was not unpacked: $py" }
          $ver = & $py --version
          if ($ver -notmatch '3\.11') { throw "Bundled Python reports '$ver', expected 3.11" }
          Write-Host "OK: installed, launched, wizard reached, $ver"
          Stop-Process -Name 'TakeOne Studio' -Force -ErrorAction SilentlyContinue

      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($p in (Join-Path $env:RUNNER_TEMP 'smoke.log'), (Join-Path $env:TEMP 'takeone-startup.log')) {
            Write-Host "---- $p"; if (Test-Path $p) { Get-Content $p -Tail 80 } else { Write-Host '(missing)' }
          }

  pip-measure-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_pip }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ['chatterbox-tts==0.1.7', 'faster-whisper==1.2.1', 'demucs==4.1.0', 'deepfilternet==0.5.6', 'lama-cleaner==1.2.5']
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Measure install size (fresh venv, dependencies included)
        shell: pwsh
        run: |
          python -m venv venv
          function Size($p) { (Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum }
          $before = Size venv
          .\venv\Scripts\python -m pip install --no-cache-dir "${{ matrix.pkg }}"
          $rc = $LASTEXITCODE
          $after = Size venv
          $line = "${{ matrix.pkg }}  rc=$rc  installBytes=$($after - $before)  ($([math]::Round(($after-$before)/1MB,1)) MiB)  python=$(.\venv\Scripts\python --version)"
          Write-Host $line; $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0) { throw 'pip install failed' }
