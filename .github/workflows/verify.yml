# TakeOne Studio — automated verification (no human QA).
# Status of this file: Implemented, NEVER RUN yet. Every job below is Not Tested until its first green run.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      measure_pip:
        description: 'Also measure pip install sizes on Windows + Python 3.11 (slow, several GB)'
        type: boolean
        default: false

jobs:
  # M1 UI AUDIT: the real Electron app (no stubs) under a throwaway HOME,
  # every screen x three viewports, automatic clipped/overlap/truncation
  # checks + contact_sheet.png artifact. This job is part of verify, so
  # the WO-40 gate fails the installer build when the audit fails — a
  # red audit can never ship. (npm ci provides the electron binary;
  # Playwright is used only as a CDP client, no browser download.)
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install playwright pillow
      - name: UI audit (Electron/CDP, 5 screens x 3 viewports)
        run: xvfb-run -a python3 tools/ui-audit.py --out ui-audit-out
      - name: Upload UI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.run_number }}
          path: ui-audit-out
          # warn, not error: a crashed audit must still fail via its own
          # exit code, and the log (with the page list) is the evidence.
          if-no-files-found: warn

  logic-and-real-aria2-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Download manager logic tests (simulated aria2c)
        run: chmod +x tests/mock-aria2c.js && node --test --test-timeout=120000 --test-reporter=spec tests/downloads.behavior.test.js
      - name: HF install-check + ensurePip regression tests
        run: node --test --test-timeout=120000 --test-reporter=spec tests/hf-install-check.test.js tests/deps-ensurepip.test.js
      - name: Download manager vs REAL aria2c (local server)
        run: |
          sudo apt-get update && sudo apt-get install -y aria2
          ARIA2C="$(which aria2c)" node --test --test-timeout=120000 --test-reporter=spec tests/downloads.real-aria2.test.js
      - name: Evidence fingerprint
        if: always()
        shell: bash
        run: |
          {
            echo "### Evidence fingerprint"
            echo "commit: $GITHUB_SHA"
            echo '```'
            git ls-files main.js package.json main tests tools .github | xargs sha256sum
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # WO-40.1: the old single windows job is split in two. NEITHER job has a
  # `needs:` on the other, so one failing never skips the other — both run
  # and both report independently on every push.
  windows-aria2:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Download manager vs the SHIPPED aria2c.exe (local server)
        shell: pwsh
        run: |
          if (-not (Test-Path resources/aria2c.exe)) { throw 'resources/aria2c.exe is missing in the repo checkout' }
          $env:ARIA2C = (Resolve-Path resources/aria2c.exe).Path
          node --test --test-timeout=120000 --test-reporter=spec tests/downloads.real-aria2.test.js

      # WO-40.3: test D alone, 10 times, against the real shipped aria2c.exe.
      # Failures are counted, never swallowed: the flake rate is printed to
      # the summary AND the step fails if even one run fails.
      - name: Test D x10 loop (flake rate)
        shell: pwsh
        run: |
          $env:ARIA2C = (Resolve-Path resources/aria2c.exe).Path
          $pass = 0; $fail = 0
          for ($i = 1; $i -le 10; $i++) {
            node --test --test-timeout=120000 --test-name-pattern='HF job interrupted' tests/downloads.real-aria2.test.js > "d-loop-$i.log" 2>&1
            if ($LASTEXITCODE -eq 0) { $pass++; Write-Host "D run $i/10: PASS" } else { $fail++; Write-Host "D run $i/10: FAIL (see d-loop-$i.log)" }
          }
          $rate = [math]::Round($fail / 10 * 100, 0)
          $line = "WO-40 test D loop: pass $pass/10, fail $fail/10, flake rate $rate%"
          Write-Host $line; $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($fail -gt 0) { Get-ChildItem d-loop-*.log | ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_.FullName -Tail 40 }; throw "test D flaked $fail/10 times — see logs above" }

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Build installer
        id: build
        shell: pwsh
        env:
          TAKEONE_SKIP_WINE: '1'
        run: |
          foreach ($f in 'resources/aria2c.exe','resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz') {
            if (-not (Test-Path $f)) { throw "Missing $f — the installer cannot be built without it." }
          }
          node build/make-readme.js
          npx electron-builder --win nsis --publish never
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/TakeOne-Studio-$v-setup.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem dist; throw "Expected $exe. The installer name must carry the version ($v): unique-version rule." }
          "v=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "SHA256 $((Get-FileHash $exe -Algorithm SHA256).Hash)  $exe" | Tee-Object -FilePath dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TakeOne-Studio-${{ steps.build.outputs.v }}-run${{ github.run_number }}
          path: |
            dist/*-setup.exe
            dist/SHA256.txt

      - name: Silent install + first-launch smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $appLog = Join-Path $env:TEMP 'takeone-startup.log'
          # WO-40.2 baseline: any TakeOne folder inside a Windows protected
          # folder that appears during this step is a failure.
          function ProtectedCandidates {
            $roots = @([Environment]::GetFolderPath('MyDocuments'), [Environment]::GetFolderPath('MyVideos'),
                       [Environment]::GetFolderPath('MyPictures'), [Environment]::GetFolderPath('MyMusic'),
                       [Environment]::GetFolderPath('Desktop'))
            foreach ($r in $roots) { foreach ($n in 'TakeOne','TakeOne Studio') { Join-Path $r $n } }
          }
          $before = @{}; foreach ($c in ProtectedCandidates) { if (Test-Path $c) { $before[$c] = $true } }
          $env:TAKEONE_SMOKE = '1'; $env:TAKEONE_SMOKE_LOG = $log
          Start-Process "${{ steps.build.outputs.exe }}" -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { Test-Path (Join-Path $_.FullName 'TakeOne Studio.exe') } | Select-Object -First 1
          if (-not $app) { throw 'Installer finished but TakeOne Studio.exe was not found under %LOCALAPPDATA%\Programs' }
          foreach ($rel in 'TakeOne Studio.exe','resources\aria2c.exe','resources\python.tar.gz') {
            if (-not (Test-Path (Join-Path $app.FullName $rel))) { throw "Installed app is missing $rel" }
          }
          if (-not (Get-Process -Name 'TakeOne Studio' -ErrorAction SilentlyContinue)) {
            Start-Process (Join-Path $app.FullName 'TakeOne Studio.exe')   # the one-click installer may or may not auto-launch
          }
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'wizard: page loaded')) { $ok = $true; break }
          }
          if (-not $ok) { throw 'The app did not reach the wizard within 180 s' }
          # WO-40.2: the app log itself must prove boot + the LOCALAPPDATA root.
          if (-not (Test-Path $appLog)) { throw "App log missing: $appLog — cannot prove BOOT start or storage root" }
          $appText = Get-Content $appLog -Raw
          if ($appText -notmatch 'BOOT start') { throw 'App log has no BOOT start line' }
          $expectedRoot = Join-Path $env:LOCALAPPDATA 'TakeOne'
          if ($appText -notmatch [regex]::Escape("storage root: $expectedRoot")) { throw "App log does not show storage root $expectedRoot" }
          foreach ($c in ProtectedCandidates) {
            if ((Test-Path $c) -and (-not $before.ContainsKey($c))) { throw "New TakeOne folder appeared in a protected folder: $c" }
          }
          # WO-39: the default root moved from Documents to %LOCALAPPDATA%.
          $py = Join-Path $env:LOCALAPPDATA 'TakeOne\.python\python.exe'
          if (-not (Test-Path $py)) { throw "Bundled Python was not unpacked: $py" }
          $ver = & $py --version
          if ($ver -notmatch '3\.11') { throw "Bundled Python reports '$ver', expected 3.11" }
          Write-Host "OK: installed, launched, wizard reached, storage root $expectedRoot, $ver"
          Stop-Process -Name 'TakeOne Studio' -Force -ErrorAction SilentlyContinue

      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($p in (Join-Path $env:RUNNER_TEMP 'smoke.log'), (Join-Path $env:TEMP 'takeone-startup.log')) {
            Write-Host "---- $p"; if (Test-Path $p) { Get-Content $p -Tail 80 } else { Write-Host '(missing)' }
          }

  pip-measure-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_pip }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pkg: ['chatterbox-tts==0.1.7', 'faster-whisper==1.2.1', 'demucs==4.1.0', 'deepfilternet==0.5.6', 'lama-cleaner==1.2.5']
        variant: ['plain', 'cu128']
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Measure install size (fresh venv, dependencies included)
        shell: pwsh
        run: |
          python -m venv venv
          function Size($p) { (Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum }
          if ("${{ matrix.variant }}" -eq "cu128") {
            .\venv\Scripts\python -m pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cu128
            if ($LASTEXITCODE -ne 0) { throw 'torch cu128 pre-install failed' }
          }
          $before = Size venv
          .\venv\Scripts\python -m pip install --no-cache-dir "${{ matrix.pkg }}"
          $rc = $LASTEXITCODE
          $after = Size venv
          $line = "${{ matrix.pkg }} [${{ matrix.variant }}]  rc=$rc  installBytes=$($after - $before)  ($([math]::Round(($after-$before)/1MB,1)) MiB)  python=$(.\venv\Scripts\python --version)"
          Write-Host $line; $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '### pip check [${{ matrix.variant }}]' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $pc = .\venv\Scripts\python -m pip check 2>&1 | Out-String
          Write-Host $pc; $pc | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '### torch info [${{ matrix.variant }}]' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $ti = & .\venv\Scripts\python -c "import torch;print(torch.__version__, torch.version.cuda)" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { $ti = 'torch NOT installed in this variant (import failed)' }
          $LASTEXITCODE = 0
          Write-Host $ti; $ti | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0) { throw 'pip install failed' }
