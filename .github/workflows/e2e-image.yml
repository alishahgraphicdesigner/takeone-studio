name: e2e-image
# WO-22 + WO-24: "Studio se asli output file" CI mein sabit karo (Windows runner, CPU).
# Engine ko main/engine.js ki functions se install karta hai (WO-21 — wahi code
# jo app chalayegi), Image Studio ka checkpoint manifest se <root>/Models/image
# mein (WO-41.4: ComfyUI/models/checkpoints mein NAHI — warna extra_model_paths
# ka bug is test se chhoot jata hai), ComfyUI --cpu par shared
# createEngineComfy() start path se, comfy-workflows.js ka shared
# sdxlLightningTxt2Img workflow: 1 prompt, 512x512.
# Output PNG: file exist + 512x512 dimensions + pixel variance > threshold +
# spatial correlation > 0.3 (noise nahi). PNG artifact upload hota hai.
# TAKEONE_SKIP_GPU_CHECK=1: runner par NVIDIA GPU nahi (failure kinds unit-tested).
# RAM/waqt par fail ho to Failed likha jata hai, raw log ke saath.
on:
  workflow_dispatch:

jobs:
  e2e-image:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Free disk (preflight print)
        run: |
          $d = Get-PSDrive C
          "FREE DISK on C: {0:N1} GB" -f ($d.Free / 1GB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-PSDrive C | Format-Table -AutoSize

      # WO-28 (4th attempt): installEngine needs the shipped python at <root>/.python —
      # same step as shipped-python-spike (root-caused from attempt 3's failure).
      - name: Place shipped Python at <root>/.python
        run: |
          $tar = "resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz"
          if (-not (Test-Path $tar)) { Write-Error "SHIPPED PYTHON TARBALL MISSING: $tar"; exit 1 }
          $e2eRoot = Join-Path $PWD ".e2e-root"
          New-Item -ItemType Directory -Force -Path $e2eRoot | Out-Null
          tar -xzf $tar -C $e2eRoot
          $inner = Get-ChildItem $e2eRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName "python.exe") } | Select-Object -First 1
          if (-not $inner) {
            Write-Host "TREE:"; Get-ChildItem $e2eRoot | Format-Table -AutoSize
            Write-Error "SHIPPED PYTHON LAYOUT: python.exe not found after extract"; exit 1
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $e2eRoot ".python") | Out-Null
          Get-ChildItem $inner.FullName | Move-Item -Destination (Join-Path $e2eRoot ".python") -Force
          & (Join-Path $e2eRoot ".python/python.exe") --version
          echo "TAKEONE_E2E_ROOT=$e2eRoot" >> $env:GITHUB_ENV

      - name: Check WO-21 engine.js exists
        run: |
          if (-not (Test-Path "main/engine.js")) {
            Write-Error "WO-21 IMPLEMENTATION PENDING: main/engine.js does not exist yet — only the design doc (round9/wo21/ENGINE-DESIGN.md) has been delivered. This workflow calls installEngine()/venvPython()/engineRoot() from that module, so it cannot proceed. Marking Failed honestly; it will run for real once the WO-21 implementation lands."
            exit 1
          }
          node -e "const e = require('./main/engine.js'); for (const f of ['installEngine','engineRoot','venvPython','readEngineState']) { if (typeof e[f] !== 'function') { throw new Error('main/engine.js missing function: ' + f); } } const c = require('./main/comfy.js'); if (typeof c.createEngineComfy !== 'function') { throw new Error('main/comfy.js missing createEngineComfy (WO-41 shared start path)'); } console.log('engine.js + shared comfy start API OK')"

      - name: Run end-to-end image generation (CPU)
        env:
          TAKEONE_SKIP_GPU_CHECK: "1"
          TAKEONE_ARIA2: ${{ github.workspace }}/resources/aria2c.exe
        run: |
          node tools/e2e-image.js 2>&1 | Tee-Object -FilePath e2e-image.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "RAW e2e-image.log tail:"; Get-Content e2e-image.log -Tail 40
            Write-Error "E2E IMAGE FAILED (raw log above)"
            exit 1
          }
        timeout-minutes: 75

      - name: Upload generated PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.png
          if-no-files-found: error
