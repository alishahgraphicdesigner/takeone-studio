name: e2e-image-models
# M3: "Image models validate on CI" (Windows runner, CPU, no GPU).
# Engine ko main/engine.js ki functions se install karta hai (wahi code
# jo app chalayegi), ComfyUI --cpu par shared createEngineComfy() start
# path se, comfy-workflows.js ke shared zImage + fluxKlein builders:
# queue -> prompt_id (NOT 400) -> interrupt. Koi 20 GB + 16 GB download
# NAHI: loader files 1-byte VALIDATION STAND-INS hain
# (e2e-image-models.js header mein wazeh) — queue validator combo
# membership check karta hai, is liye bina un ke queue WO-41 ki tarah
# 400 deta. Asli images M3 bake-off hai (Ali ke GPU par) aur us tak
# Not Tested rehta hai.
# TAKEONE_SKIP_GPU_CHECK=1: runner par NVIDIA GPU nahi (failure kinds unit-tested).
on:
  workflow_dispatch:

jobs:
  e2e-image-models:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Same step as e2e-image: installEngine needs the shipped python at <root>/.python.
      - name: Place shipped Python at <root>/.python
        run: |
          $tar = "resources/python-3.11.17-windows-x86_64-install_only_stripped.tar.gz"
          if (-not (Test-Path $tar)) { Write-Error "SHIPPED PYTHON TARBALL MISSING: $tar"; exit 1 }
          $e2eRoot = Join-Path $PWD ".e2e-root"
          New-Item -ItemType Directory -Force -Path $e2eRoot | Out-Null
          tar -xzf $tar -C $e2eRoot
          $inner = Get-ChildItem $e2eRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName "python.exe") } | Select-Object -First 1
          if (-not $inner) {
            Write-Host "TREE:"; Get-ChildItem $e2eRoot | Format-Table -AutoSize
            Write-Error "SHIPPED PYTHON LAYOUT: python.exe not found after extract"; exit 1
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $e2eRoot ".python") | Out-Null
          Get-ChildItem $inner.FullName | Move-Item -Destination (Join-Path $e2eRoot ".python") -Force
          & (Join-Path $e2eRoot ".python/python.exe") --version
          echo "TAKEONE_E2E_ROOT=$e2eRoot" >> $env:GITHUB_ENV

      - name: Check M3 image-models modules exist
        run: |
          node -e "const e = require('./main/engine.js'); for (const f of ['installEngine','engineRoot','venvPython']) { if (typeof e[f] !== 'function') { throw new Error('main/engine.js missing function: ' + f); } } const c = require('./main/comfy.js'); if (typeof c.createEngineComfy !== 'function') { throw new Error('main/comfy.js missing createEngineComfy'); } const w = require('./main/comfy-workflows.js'); for (const f of ['zImage','fluxKlein','buildImageModelsPackJobs']) { if (typeof w[f] !== 'function') { throw new Error('main/comfy-workflows.js missing ' + f + ' (M3)'); } } const cat = require('./main/catalog.js'); for (const id of ['z-image-turbo','flux2-klein-4b']) { if (!cat.CATALOG.find((t) => t.id === id)) { throw new Error('catalog missing ' + id + ' (M3)'); } } console.log('M3 image-models modules OK')"

      - name: Run end-to-end image-models validation (CPU, interrupt after queue)
        env:
          TAKEONE_SKIP_GPU_CHECK: "1"
          TAKEONE_ARIA2: ${{ github.workspace }}/resources/aria2c.exe
        run: |
          node tools/e2e-image-models.js 2>&1 | Tee-Object -FilePath e2e-image-models.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "RAW e2e-image-models.log tail:"; Get-Content e2e-image-models.log -Tail 40
            Write-Error "E2E IMAGE-MODELS FAILED (raw log above)"
            exit 1
          }
        timeout-minutes: 75

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image-models-log
          path: e2e-image-models.log
          if-no-files-found: error
