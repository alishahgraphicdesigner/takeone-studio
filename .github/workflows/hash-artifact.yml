name: hash-artifact
# WO-34 (temporary): compute the SHA256 of an installer artifact from a past run,
# IN CI — never by hand. Used once to record the round-11 2.2.10 build's hash in
# docs/VERSIONS.md. Delete after use.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID whose artifact to hash'
        required: true
      artifact_name:
        description: 'Artifact name'
        required: true
        default: 'TakeOne-Studio-installer'

jobs:
  hash-artifact:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read # needed to download an artifact from another run
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # actions/download-artifact@v4 with run-id could not find the artifact
      # (tried twice); the gh API works reliably instead.
      - name: Download artifact via gh API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artId = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/${{ inputs.run_id }}/artifacts" --jq '.artifacts[] | select(.name=="${{ inputs.artifact_name }}") | .id'
          if (-not $artId) { Write-Error "artifact '${{ inputs.artifact_name }}' not found on run ${{ inputs.run_id }}"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artId/zip" > artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force

      - name: SHA256 (CI-computed)
        run: |
          $exe = Get-ChildItem artifact/TakeOne-Studio-*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no setup.exe in artifact"; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256_CI=$hash"
          Write-Host "FILE_CI=$($exe.Name)"
